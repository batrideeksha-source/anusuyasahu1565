<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>साहित्यकार परिचय | अनुसुया साहू</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html" data-site-name>अनुसुया साहू</a><button class="menu btn alt" aria-label="Menu">☰</button><nav><a href="index.html">मुखपृष्ठ</a><a href="about.html">परिचय</a><a href="poems.html">कविताएँ</a><a href="events.html">कार्यक्रम</a><a href="people.html">अतिथि</a><a href="gallery.html">दीर्घा</a><a href="contact.html">संपर्क</a></nav></div></header><main id="profile"><section class="page-hero"><div class="container"><h1>प्रोफ़ाइल लोड हो रही है…</h1></div></section></main><footer><div class="container"><div class="footer-brand"><span class="kicker gold">Literary Community</span><h2 data-site-name>अनुसुया साहू</h2></div><div class="footer-bottom">© <span id="year"></span> अनुसुया साहू</div></div></footer><script src="js/app.js"></script><script>year.textContent=new Date().getFullYear();(async()=>{let id=new URLSearchParams(location.search).get('id'),a=(await data('people')).filter(x=>x.published),x=a.find(p=>p.id===id||p.slug===id);if(!x){profile.innerHTML='<section class="page-hero"><div class="container"><h1>प्रोफ़ाइल नहीं मिली</h1><p><a href="people.html">सभी साहित्यकार एवं अतिथि देखें</a></p></div></section>';return}document.title=`${x.nameHindi||x.name} | अनुसुया साहू`;let links=[['Website',x.website],['YouTube',x.youtube],['Facebook',x.facebook],['Instagram',x.instagram]].filter(z=>z[1]);profile.innerHTML=`<section class="person-hero"><div class="container person-hero-grid"><div class="person-detail-photo">${x.photo?img(x.photo,x.name):'<span>✦</span>'}</div><div><span class="kicker">${esc(x.role||'Featured Guest')}</span><h1>${esc(x.nameHindi||x.name)}</h1>${x.nameHindi&&x.name?`<h2>${esc(x.name)}</h2>`:''}<p class="person-designation">${esc(x.designation||'')}</p><p class="person-location">${esc(x.country||'')}</p>${x.shortBio?`<p class="person-lead">${esc(x.shortBio)}</p>`:''}${links.length?`<div class="actions">${links.map(z=>`<a class="btn alt" href="${esc(z[1])}" target="_blank" rel="noopener">${z[0]} ↗</a>`).join('')}</div>`:''}</div></div></section><section class="section"><div class="container profile-content"><div class="profile-main"><span class="section-no">01</span><h2>परिचय</h2><div class="rich-copy">${esc(x.bio||x.shortBio||'विस्तृत परिचय शीघ्र जोड़ा जाएगा।').replace(/\n/g,'<br>')}</div>${x.works?`<span class="section-no">02</span><h2>प्रमुख कृतियाँ एवं साहित्यिक कार्य</h2><div class="rich-copy">${esc(x.works).replace(/\n/g,'<br>')}</div>`:''}${x.awards?`<span class="section-no">03</span><h2>सम्मान एवं उपलब्धियाँ</h2><div class="rich-copy">${esc(x.awards).replace(/\n/g,'<br>')}</div>`:''}</div><aside class="profile-side"><div class="profile-fact"><span>भूमिका</span><b>${esc(x.role||'—')}</b></div><div class="profile-fact"><span>स्थान</span><b>${esc(x.country||'—')}</b></div><a class="text-link" href="people.html">← सभी अतिथि देखें</a></aside></div></section>`})()</script></body></html>
