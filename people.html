<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="अनुसुया साहू के साहित्यिक आयोजनों से जुड़े विशिष्ट साहित्यकार, कलाकार एवं वक्ता"><title>विशिष्ट साहित्यकार एवं अतिथि | अनुसुया साहू</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html" data-site-name>अनुसुया साहू</a><button class="menu btn alt" aria-label="Menu">☰</button><nav><a href="index.html">मुखपृष्ठ</a><a href="about.html">परिचय</a><a href="poems.html">कविताएँ</a><a href="books.html">पुस्तकें</a><a href="events.html">कार्यक्रम</a><a href="people.html">अतिथि</a><a href="gallery.html">दीर्घा</a><a href="achievements.html">सम्मान</a><a href="contact.html">संपर्क</a></nav></div></header><main><section class="page-hero"><div class="container"><span class="kicker">Featured Artists & Speakers</span><h1>विशिष्ट साहित्यकार एवं अतिथि</h1><p>साहित्य, कला और संस्कृति के उन रचनात्मक व्यक्तित्वों से परिचय जो विभिन्न आयोजनों और संवादों से जुड़े हैं।</p></div></section><section class="section" style="padding-top:25px"><div class="container"><div class="people-tools"><input id="peopleSearch" placeholder="नाम, देश या भूमिका से खोजें…"><select id="peopleRole"><option value="">सभी श्रेणियाँ</option></select></div><div class="people-grid" id="peopleList"></div></div></section></main><footer><div class="container"><div class="footer-brand"><span class="kicker gold">Official Website</span><h2 data-site-name>अनुसुया साहू</h2></div><div class="footer-bottom">© <span id="year"></span> अनुसुया साहू</div></div></footer><script src="js/app.js"></script><script>year.textContent=new Date().getFullYear();let all=[];function draw(){let q=peopleSearch.value.toLowerCase(),r=peopleRole.value;let a=all.filter(x=>(!r||x.role===r)&&(`${x.name||''} ${x.nameHindi||''} ${x.country||''} ${x.role||''}`).toLowerCase().includes(q));peopleList.innerHTML=a.length?a.map(x=>`<article class="person-card"><a class="person-photo" href="person.html?id=${encodeURIComponent(x.id)}">${x.photo?img(x.photo,x.name):'<span>✦</span>'}</a><div class="person-info"><span class="meta">${esc(x.role||'साहित्यकार')}</span><h2><a href="person.html?id=${encodeURIComponent(x.id)}">${esc(x.nameHindi||x.name)}</a></h2>${x.nameHindi&&x.name?`<p class="person-en">${esc(x.name)}</p>`:''}<p>${esc(x.designation||'')}${x.country?' · '+esc(x.country):''}</p><p class="person-bio">${esc(x.shortBio||'')}</p><a class="text-link" href="person.html?id=${encodeURIComponent(x.id)}">विस्तृत परिचय / Know more ↗</a></div></article>`).join(''):'<div class="empty">अभी कोई प्रकाशित प्रोफ़ाइल उपलब्ध नहीं है।</div>'} (async()=>{all=(await data('people')).filter(x=>x.published);[...new Set(all.map(x=>x.role).filter(Boolean))].sort().forEach(r=>peopleRole.insertAdjacentHTML('beforeend',`<option>${esc(r)}</option>`));peopleSearch.oninput=peopleRole.onchange=draw;draw()})()</script></body></html>
