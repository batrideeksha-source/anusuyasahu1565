<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="अनुसुया साहू की पुस्तकें"><title>पुस्तकें | अनुसुया साहू</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html" data-site-name>अनुसुया साहू</a><button class="menu btn alt" aria-label="Menu">☰</button><nav><a href="index.html">मुखपृष्ठ</a><a href="about.html">परिचय</a><a href="poems.html">कविताएँ</a><a href="books.html">पुस्तकें</a><a href="events.html">कार्यक्रम</a><a href="gallery.html">दीर्घा</a><a href="achievements.html">सम्मान</a><a href="contact.html">संपर्क</a></nav></div></header><main><section class="page-hero"><div class="container"><span class="ornament">✦ ✦ ✦</span><h1>पुस्तकें</h1><p>प्रकाशित कृतियाँ और साहित्यिक संकलन</p></div></section><section class="section" style="padding-top:25px"><div class="container"><div class="grid" id="list"></div></div></section></main><footer><div class="container"><h3 data-site-name>अनुसुया साहू</h3><p>कविता · साहित्य · संस्कृति</p><div class="footer-bottom">© <span id="year"></span> अनुसुया साहू</div></div></footer><script src="js/app.js"></script><script>year.textContent=new Date().getFullYear();(async()=>{let a=(await data('books')).filter(x=>x.published);list.innerHTML=a.length?a.map(x=>`<article class="card">${img(x.cover,x.name)}<div class="meta">${esc(x.publisher||'पुस्तक')}</div><h3>${esc(x.name)}</h3><p>${esc(x.description||'')}</p>${x.purchaseLink?`<a class="btn" href="${esc(x.purchaseLink)}" target="_blank" rel="noopener">पुस्तक देखें</a>`:''}</article>`).join(''):'<div class="empty">पुस्तकों की जानकारी शीघ्र उपलब्ध होगी।</div>'})()</script></body></html>
