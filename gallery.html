<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="अनुसुया साहू की साहित्यिक और सांस्कृतिक चित्र दीर्घा"><title>चित्र दीर्घा | अनुसुया साहू</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html" data-site-name>अनुसुया साहू</a><button class="menu btn alt" aria-label="Menu">☰</button><nav><a href="index.html">मुखपृष्ठ</a><a href="about.html">परिचय</a><a href="poems.html">कविताएँ</a><a href="books.html">पुस्तकें</a><a href="events.html">कार्यक्रम</a><a href="gallery.html">दीर्घा</a><a href="achievements.html">सम्मान</a><a href="contact.html">संपर्क</a></nav></div></header><main><section class="page-hero"><div class="container"><span class="ornament">✦ ✦ ✦</span><h1>चित्र दीर्घा</h1><p>कार्यक्रम, सम्मान, सांस्कृतिक गतिविधियाँ और यादगार क्षण</p></div></section><section class="section" style="padding-top:25px"><div class="container"><div class="grid" id="list"></div></div></section></main><footer><div class="container"><h3 data-site-name>अनुसुया साहू</h3><p>कविता · साहित्य · संस्कृति</p><div class="footer-bottom">© <span id="year"></span> अनुसुया साहू</div></div></footer><script src="js/app.js"></script><script>year.textContent=new Date().getFullYear();(async()=>{let a=(await data('gallery')).filter(x=>x.published);list.innerHTML=a.length?a.map(x=>`<article class="card" style="padding:12px">${img(x.image,x.caption)}<div style="padding:0 10px 10px"><div class="meta">${esc(x.category||'Gallery')}</div><h3>${esc(x.caption||'')}</h3></div></article>`).join(''):'<div class="empty">चित्र दीर्घा में नई तस्वीरें शीघ्र जोड़ी जाएँगी।</div>'})()</script></body></html>
